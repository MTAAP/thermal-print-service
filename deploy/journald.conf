# Keep logs across a reboot, and bound their size so the SD card is not worn out
# holding them.
#
# Storage matters more than it looks. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf with
# Storage=volatile, which puts the journal on tmpfs -- so every reboot loses
# every log that preceded it, and a box that hangs for 22 hours comes back with
# no evidence of what happened. Drop-ins are applied in filename order, so this
# file has to sort AFTER 40- to win. That is the whole reason for the 50- prefix
# it is installed under; the previous 00- name lost to the vendor file silently.
[Journal]
Storage=persistent
SystemMaxUse=50M
SystemMaxFiles=10
