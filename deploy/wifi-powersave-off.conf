# Turn off wifi power save on the BCM43430.
#
# dmesg shows brcmfmac enabling power save by default. On this chip that is a
# known source of firmware wedges under sustained or bursty traffic, which is
# this box's normal workload: a relay long-polling the hub plus on-demand HTTPS.
# A wedge leaves the Pi locally healthy and unreachable from every network path.
#
# 2 = disable. NetworkManager applies this to every wifi connection.
[connection]
wifi.powersave = 2
