# Stop systemd petting the hardware watchdog, so io-stall-watchdog can own it.
#
# Raspberry Pi OS ships 40-rpi-enable-watchdog.conf with RuntimeWatchdogSec=1m.
# That keepalive proves only that PID 1 is still scheduling: it never touches the
# disk and never sends a packet, so it happily pets the watchdog through an SD
# stall or a wifi firmware wedge, which is exactly how this box stayed dark for
# 31 hours once and 22 hours again. Only one process may hold /dev/watchdog0, so
# systemd holding it also locks out the daemon that checks the real surfaces.
#
# Sorts after 40- so it wins. io-stall-watchdog.service takes the device instead
# and pets it only while disk and network both answer.
[Manager]
RuntimeWatchdogSec=0
